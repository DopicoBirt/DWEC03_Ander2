<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego</title>
  <link rel="stylesheet" href="../CSS/css/estilos.css">
</head>
<body>
<header class="cabecera">
  <span>Memoria de Parejas</span>
  <span id="textoNivel"></span>
</header>

 <main class="zonaJuego">
  <section id="info">
    <div class="caja cajaTiempo">
      <p>Tiempo restante</p>
      <p class="numero"><span id="tiempo">30</span> s</p>
      <div class="barra"><div id="barraRelleno"></div></div>
    </div>
    <div class="caja">
      <p>Intentos</p>
      <p class="numero" id="intentos">0</p>
    </div>
    <div class="caja">
      <p>Parejas</p>
      <p class="numero"><span id="parejas">0</span> / <span id="totalParejas"></span></p>
    </div>
    <div class="caja cajaPausa">
      <p class="numero">Tecla P</p>
      <p id="estadoPausa">Pausar / Reanudar</p>
    </div>
  </section>

  <section id="tablero"></section>
</main>

  <script src="../js/js/juego.js"></script>
</body>
</html>
